spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/mapit-test
  mail:
    # Solo hace falta para que Spring Boot cree el bean JavaMailSender en el
    # contexto de test; ningun test envia correos reales (MailService va mockeado).
    host: localhost
    port: 2525
    username: test
    password: test

mapit:
  jwt:
    secret: clave-secreta-para-tests-unitarios-1234567890
    expiration-seconds: 3600
  geo:
    provider-url: "http://ip-api.com/json"
    timeout-ms: 3000
    allow-sim-ip: false
    fallback-lat: 40.4168
    fallback-lng: -3.7038
  mail:
    from: no-reply@mapit-test.local
    frontend-base-url: http://localhost:4200
    resend-cooldown-seconds: 60
    verification-ttl-minutes: 20
    reset-ttl-minutes: 15