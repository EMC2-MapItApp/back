# ─────────────────────────────────────────────────────────────
# Perfil: PROD (Google Cloud Run)
#
# Variables inyectadas por Cloud Run:
#   SPRING_DATA_MONGODB_URI  -> Secret Manager (nativo Spring, no necesita YAML)
#   MAPIT_JWT_SECRET         -> Secret Manager (relaxed binding: mapit.jwt.secret)
#   MAPIT_JWT_EXPIRATION     -> variable de entorno (puente necesario: ver abajo)
# ─────────────────────────────────────────────────────────────
server:
  port: 8090

spring:
  mail:
    host: ${MAPIT_SMTP_HOST}
    port: ${MAPIT_SMTP_PORT}
    username: ${MAPIT_SMTP_USERNAME}
    password: ${MAPIT_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mapit:
  jwt:
    # MAPIT_JWT_EXPIRATION no mapea automaticamente a expiration-seconds
    # (el relaxed binding solo mapea MAPIT_JWT_EXPIRATION_SECONDS).
    # Este puente es necesario mientras Cloud Run use MAPIT_JWT_EXPIRATION.
    expiration-seconds: ${MAPIT_JWT_EXPIRATION:86400}
  geo:
    allow-sim-ip: false
  mail:
    # Dominio real de Cloudflare donde se sirve el frontend en produccion
    frontend-base-url: ${MAPIT_FRONTEND_URL}
  push:
    vapid:
      # Par de claves VAPID — Secret Manager, igual que MAPIT_JWT_SECRET/MAPIT_SMTP_PASSWORD.
      public-key: ${MAPIT_VAPID_PUBLIC_KEY:}
      private-key: ${MAPIT_VAPID_PRIVATE_KEY:}

logging:
  level:
    root: WARN
    emc.mapIt: INFO
    org.mongodb.driver: WARN