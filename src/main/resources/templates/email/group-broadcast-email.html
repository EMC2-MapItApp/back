<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Nuevo mensaje en tu grupo de MapIt</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:linear-gradient(90deg,#3f51b5,#7c3aed);padding:24px 32px;">
              <img src="cid:mapitLogo" width="28" height="28" alt="" style="vertical-align:middle;margin-right:8px;" /><span style="color:#ffffff;font-size:20px;font-weight:bold;">MapIt</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 16px;font-size:20px;color:#1a1a1a;">Hola {{recipientName}},</h1>
              <p style="margin:0 0 16px;font-size:15px;line-height:1.5;color:#4a4a4a;">
                <strong>{{organizerName}}</strong>, organizador de tu grupo <strong>{{groupName}}</strong>, ha enviado un mensaje a todo el grupo:
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;border-radius:8px;border-left:4px solid #3f51b5;">
                <tr>
                  <td style="padding:16px 20px;">
                    <p style="margin:0 0 8px;font-size:15px;font-weight:700;color:#1a1a1a;">{{subject}}</p>
                    <p style="margin:0;font-size:14px;line-height:1.6;color:#1a1a1a;white-space:pre-wrap;">{{message}}</p>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#8a8a8a;">
                Este correo es informativo; para responder, contacta directamente con {{organizerName}} desde MapIt.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
