<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Nueva solicitud de acceso a tu evento en MapIt</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:linear-gradient(90deg,#3f51b5,#7c3aed);padding:24px 32px;">
              <img src="cid:mapitLogo" width="28" height="28" alt="" style="vertical-align:middle;margin-right:8px;" /><span style="color:#ffffff;font-size:20px;font-weight:bold;">MapIt</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 16px;font-size:20px;color:#1a1a1a;">Hola {{authorName}},</h1>
              <p style="margin:0 0 16px;font-size:15px;line-height:1.5;color:#4a4a4a;">
                <strong>{{requesterName}}</strong> ha solicitado apuntarse a tu evento privado <strong>{{publicationTitle}}</strong>.
              </p>
              <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#4a4a4a;">
                Puedes aceptar o rechazar la solicitud desde "Mis publicaciones" en MapIt.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-radius:8px;background-color:#3f51b5;">
                    <a href="{{appLink}}" style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">
                      Ver solicitud
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
