# ─────────────────────────────────────────────────────────────
# Configuración BASE — común a todos los entornos.
# Aquí NO van: puertos, credenciales, ni URLs de base de datos.
# Esos valores se sobreescriben en application-{perfil}.yaml
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: mapIt
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Europe/Madrid

mapit:
  geo:
    provider-url: "http://ip-api.com/json"
    timeout-ms: 3000
    fallback-lat: 40.4168
    fallback-lng: -3.7038
  mail:
    from: ${MAPIT_MAIL_FROM:no-reply@mapit.local}
    # Cooldown server-side para /resend-verification (el debounce de 60s del cliente es
    # solo UX, este es el que realmente evita abuso)
    resend-cooldown-seconds: 60
    verification-ttl-minutes: 20
    # TTL corto para el token de "olvidé mi contraseña" (más corto que verificación: el email
    # llega en segundos y el usuario suele abrirlo de inmediato)
    reset-ttl-minutes: 15
  push:
    vapid:
      # Identidad de contacto exigida por el protocolo VAPID (RFC 8292) — el push service del
      # navegador puede usarla para contactar al emisor si abusa del canal. Las claves
      # público/privada sí son sensibles y se declaran por entorno (application-dev/prod.yaml).
      subject: ${MAPIT_VAPID_SUBJECT:mailto:no-reply@mapit.local}

