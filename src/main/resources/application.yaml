# ─────────────────────────────────────────────────────────────
# Configuración BASE — común a todos los entornos.
# Aquí NO van: puertos, credenciales, ni URLs de base de datos.
# Esos valores se sobreescriben en application-{perfil}.yaml
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: mapIt
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Europe/Madrid

mapit:
  geo:
    provider-url: "http://ip-api.com/json"
    timeout-ms: 3000
    fallback-lat: 40.4168
    fallback-lng: -3.7038

