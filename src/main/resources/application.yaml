
server:
  port: 8090

spring:
  application:
    name: mapIt

  datasource:
    url: jdbc:postgresql://localhost:5432/mapit_db
    username: postgres
    password: win98se
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Para manejar las zonas horarias correctamente
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Europe/Madrid

mapit:
  jwt:
    secret: mapit-dev-secret-change-me
    expiration-seconds: 86400
  geo:
    provider-url: "http://ip-api.com/json"
    timeout-ms: 3000
    allow-sim-ip: false #permite la simulación de IP para pruebas
    fallback-lat: 40.4168
    fallback-lng: -3.7038

# Configuración de logging para repositorios
  logging:
    level:
      emc.mapIt.repository: DEBUG
      # org.springframework.data.jpa: DEBUG
